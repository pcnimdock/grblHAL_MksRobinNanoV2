# This is the configuration file for PlatformIO, a cross-platform tool and IDE
# to build and develop software for embedded systems.
#
# To build the firmware with PlatformIO, install PlatformIO Core (CLI, no GUI):
# - https://docs.platformio.org/en/latest//core/installation.html
#
# For documentation on this file, see:
# - https://docs.platformio.org/en/latest/projectconf/index.html
#
# To add support for another STM32F1xx board, add a new [env:name..] section
# with the appropriate `board` and (optionally) `board_build.ldscript`.
# For a list of supported hardware, see:
# - https://docs.platformio.org/en/latest/platforms/ststm32.html
#
# To add support for additional grblHAL plugins or drivers, make the necessary
# changes to the common.build_flags, common.lib_deps and common.lib_extra_dirs
# below.
#
# By default this file sets the preprocessor directive `OVERRIDE_MY_MACHINE`
# to ignore all settings in `Inc/my_machine.h`.  Instead, you should edit this
# file and add the necessary directives (e.g. `-D FOOBAR_ENABLE`) to either
# `common.build_flags` or the environment specific `build_flags`.
#
# Typical command line usage:
#
#    # Build firmware for all defined environments
#    pio run
#    # Build only for specific environments with the -e option
#    pio run -e BTT_SKR_MINI_E3_V20 -e BTT_SKR_MINI_E3_V20_USB
#    # List the freshly built firmware ELF (.elf) and binary (.bin) files:
#    ls -l .pio/build/*/firmware.*
#    # If the target supports uploading (via `upload_protocol`):
#    pio run -e bluepill_f103c8_128k -t upload
#    # Clean up build related resources
#    pio run -t clean
#

#
# NOTE: PlatformIO support is provided by the community and platformio.ini is
# not maintained or tested by the repo owner.
# Please submit a PR with bug fixes and enhancments.
#

[platformio]
include_dir = Inc
src_dir = Src

[common]
build_flags =
  -I .
  -I boards
  -I grbl
  -I motors
  -I trinamic
  -I eeprom
  -I keypad
  -I odometer
  -I plugins
  -I sdcard
  -I FatFs
  -I Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc
  -I Middlewares/ST/STM32_USB_Device_Library/Core/Inc
  -I USB_DEVICE/Target
  -D RX_BUFFER_SIZE=512
  -D NVS_SIZE=1536
  # Ignore all settings in Inc/my_machine.h (and instead use the below build flags)
  -D OVERRIDE_MY_MACHINE
  # Uncomment to enable debug builds
  #-D DEBUG
  # Uncomment to enable support for keypad
  #-D KEYPAD_ENABLE=1
  # Uncomment to enable support for odometer
  #-D ODOMETER_ENABLE=1
  # Uncomment to enable support for running G-code from the microSD card
  # You also need to uncomment FatFs and sdcard in lib_deps (see below)
  #-D SDCARD_ENABLE=1
lib_deps =
  boards
  grbl
  keypad
  motors
  odometer
  plugins
# To enable support for SD card uncomment `FatFs` and `sdcard` below.
  #FatFs
  #sdcard
  # USB serial support
  Core
  Class
  App
  Target
lib_extra_dirs =
  .
  FatFs
  Middlewares/ST/STM32_USB_Device_Library
  USB_DEVICE

[env]
platform = ststm32
framework = stm32cube
# Do not produce .a files for lib deps (which would prevent them from overriding weak symbols)
lib_archive = no
lib_ldf_mode = off

[env:MKS_ROBIN_NANO_V2]
board = genericSTM32F103VE
board_build.ldscript = STM32F103VETX_FLASH.ld
build_flags = ${common.build_flags}
  # See boards/my_machine_map.h for the pin map
  -D BOARD_MY_MACHINE=
  -D N_AXIS=3
  -D USB_SERIAL_CDC=0
  # The onboard CH340 USB-serial chip is wired to USART3 (PB10=TX, PB11=RX) -
  # that's the port grblHAL should talk to the PC on, same as stock Marlin.
  -D SERIAL_PORT=3
  # Settings ($$ params) are stored in flash-emulated NVS by default - simpler
  # and safer than trying to guess the onboard I2C EEPROM's address/bus without
  # hardware in hand. Revisit later if you want real EEPROM persistence.
  #
  # The stock MKS boot loader occupies the first 28K of flash and jumps to
  # 0x08007000, so the vector table and the FLASH region have to be relocated.
  # Same values as Marlin's board_build.offset / board_upload.offset_address.
  -D VECT_TAB_OFFSET=0x7000
  -Wl,--defsym=LD_VECT_TAB_OFFSET=0x7000
  #
  # --- Machine defaults, taken from the working Marlin configuration --------
  # These only apply on a fresh NVS (or after $RST=*); afterwards they live in
  # flash and are changed with $ commands.
  #
  # 800 steps/mm on all three axes (DEFAULT_AXIS_STEPS_PER_UNIT)
  -D DEFAULT_X_STEPS_PER_MM=800.0f
  -D DEFAULT_Y_STEPS_PER_MM=800.0f
  -D DEFAULT_Z_STEPS_PER_MM=800.0f
  # DEFAULT_MAX_FEEDRATE { 33, 33, 11 } mm/s -> mm/min
  -D DEFAULT_X_MAX_RATE=1980.0f
  -D DEFAULT_Y_MAX_RATE=1980.0f
  -D DEFAULT_Z_MAX_RATE=660.0f
  # DEFAULT_MAX_ACCELERATION { 200, 200, 100 } mm/s^2
  -D DEFAULT_X_ACCELERATION=200.0f
  -D DEFAULT_Y_ACCELERATION=200.0f
  -D DEFAULT_Z_ACCELERATION=100.0f
  # X_BED_SIZE / Y_BED_SIZE / Z_MAX_POS
  -D DEFAULT_X_MAX_TRAVEL=200.0f
  -D DEFAULT_Y_MAX_TRAVEL=300.0f
  -D DEFAULT_Z_MAX_TRAVEL=50.0f
  # TMC2209: 800 mA RMS, 16 microsteps, spreadCycle (STEALTHCHOP_XY/Z are off
  # in the Marlin config, and 0 is grblHAL's default for TMC_STEALTHCHOP)
  -D DEFAULT_X_CURRENT=800.0f
  -D DEFAULT_Y_CURRENT=800.0f
  -D DEFAULT_Z_CURRENT=800.0f
  # Homing: X_HOME_DIR -1, Y_HOME_DIR -1, Z_HOME_DIR +1.
  # $23 bits set = home towards min, so X|Y = 3 and Z (unset) goes to max.
  -D DEFAULT_HOMING_ENABLE=1
  -D DEFAULT_HOMING_DIR_MASK=3
  # HOMING_FEEDRATE_MM_M { 1200, 1200, 600 }. One value for all axes here; the
  # planner clamps Z to its own max rate. Enable per-axis rates later if wanted.
  -D DEFAULT_HOMING_SEEK_RATE=1200.0f
  -D DEFAULT_HOMING_FEED_RATE=200.0f
  # Soft limits need homing, and are worth having on a CNC.
  -D DEFAULT_SOFT_LIMIT_ENABLE=1
  # Keep the steppers energized when idle. grblHAL's default $1 is 25 ms, which
  # would cut holding current on Z a moment after every move ends and let the
  # spindle sag. Marlin only de-energizes after 120 s (DEFAULT_STEPPER_TIMEOUT_SEC)
  # and never during a job; 255 means "always on", which is what a mill wants.
  -D DEFAULT_STEPPER_IDLE_LOCK_TIME=255
lib_deps = ${common.lib_deps}
  trinamic
lib_extra_dirs = ${common.lib_extra_dirs}
# Produce the SD-card image the stock MKS boot loader expects: firmware.bin
# XOR-scrambled and renamed to Robin_nano35.bin.
extra_scripts = post:mks_encrypt.py

[env:BTT_SKR_MINI_E3_V20]
board = genericSTM32F103RC
board_build.ldscript = STM32F103RCTX_FLASH.ld
build_flags = ${common.build_flags}
  # See Inc/my_machine.h for options
  -D BOARD_BTT_SKR_MINI_E3_V20=
  -D USB_SERIAL_CDC=0
  # Relocate the vector table where the boot loader expects to find them
  -D VECT_TAB_OFFSET=0x7000
  -Wl,--defsym=LD_VECT_TAB_OFFSET=0x7000
lib_deps = ${common.lib_deps}
  eeprom
  trinamic
lib_extra_dirs = ${common.lib_extra_dirs}
# Upload is not supported for this board since BOOT0 is tied to GND.
# With the default boot loader, you must deploy new firmware by copying
# .pio/build/<env name>/firmware.bin (produced by `pio run`) to the SD card.

[env:BTT_SKR_MINI_E3_V20_USB]
board = genericSTM32F103RC
board_build.ldscript = STM32F103RCTX_FLASH.ld
build_flags = ${common.build_flags}
  # See Inc/my_machine.h for options
  -D BOARD_BTT_SKR_MINI_E3_V20=
  -D USB_SERIAL_CDC=1
  # Relocate the vector table where the boot loader expects to find them
  -D VECT_TAB_OFFSET=0x7000
  -Wl,--defsym=LD_VECT_TAB_OFFSET=0x7000
lib_deps = ${common.lib_deps}
  eeprom
  trinamic
lib_extra_dirs = ${common.lib_extra_dirs}
# Upload is not supported for this board since BOOT0 is tied to GND.
# With the default boot loader, you must deploy new firmware by copying
# .pio/build/<env name>/firmware.bin (produced by `pio run`) to the SD card.

[env:bluepill_f103c8_128k]
board = bluepill_f103c8_128k
board_build.ldscript = STM32F103C8TX_FLASH.ld
build_flags = ${common.build_flags}
  # See Inc/my_machine.h for options
  -D BOARD_CNC3040=
  -D USB_SERIAL_CDC=0
lib_deps = ${common.lib_deps}
  eeprom
lib_extra_dirs = ${common.lib_extra_dirs}
upload_protocol = stlink

[env:bluepill_f103c8_128k_USB]
board = bluepill_f103c8_128k
board_build.ldscript = STM32F103C8TX_FLASH.ld
build_flags = ${common.build_flags}
  # See Inc/my_machine.h for options
  -D BOARD_CNC3040=
  -D NO_SETTINGS_DESCRIPTIONS=
  -D USB_SERIAL_CDC=1
lib_deps = ${common.lib_deps}
  eeprom
lib_extra_dirs = ${common.lib_extra_dirs}
upload_protocol = stlink